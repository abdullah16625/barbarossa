<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الأخوان بربروسا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --olive:#494d3c; --olive-2:#5d624d; --olive-d:#363a2c; --cream:#efe4d8; --panel:#fffbf8; --paper:#fff7f2;
  --brick:#9b3b2a; --brick-2:#b24a37; --green:#3f5a35; --green-2:#4d6e41; --accent:#c9b8a3; --sand:#8a6a45;
  --gold:#b8902f; --sea:#5f7d78; --sea-2:#7f9a92; --sea-3:#a9bdb4; --wood:#6b4f35;
  --shadow:0 1px 0 rgba(73,77,60,.08), 0 12px 30px -18px rgba(73,77,60,.5);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Cairo',system-ui,sans-serif;color:var(--olive);min-height:100vh;
  background:radial-gradient(1200px 600px at 85% -10%,rgba(201,184,163,.35),transparent 60%),var(--paper)}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}
body.busy .grid, body.busy .qpanel, body.busy .tools{pointer-events:none}
.frame{min-height:100vh;padding:16px;display:flex;flex-direction:column}
.inner{flex:1;border:2.5px solid var(--olive);border-radius:6px;padding:14px 20px 0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.inner.quake{animation:quake .55s}
@keyframes quake{0%,100%{transform:none}15%{transform:translate(-7px,3px)}30%{transform:translate(6px,-4px)}45%{transform:translate(-5px,2px)}60%{transform:translate(4px,-2px)}80%{transform:translate(-2px,1px)}}

/* header */
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin-bottom:12px}
.subt{display:block;width:100%;max-width:520px;font-family:inherit;color:var(--brick);font-weight:800;font-size:14px;background:transparent;border:0;border-bottom:1.5px dashed transparent;padding:0;outline:none}
.subt:hover,.subt:focus{border-bottom-color:var(--accent)}
.subt::placeholder{color:transparent}
.subt:hover::placeholder,.subt:focus::placeholder{color:#c4b6a4}
.brand h1{margin:0;font-size:clamp(26px,2.8vw,38px);font-weight:900;line-height:1.1;display:flex;align-items:center;gap:10px}
.brand h1 svg{width:34px;height:34px;color:var(--sea)}
.round{display:flex;align-items:center;gap:10px;background:var(--olive);color:var(--cream);border-radius:999px;padding:6px 22px;box-shadow:var(--shadow)}
.round .lbl{font-size:15px;opacity:.85}
.round .val{font-size:30px;font-weight:900;line-height:1}
.tools{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.tbtn{background:transparent;border:1.5px solid var(--olive);color:var(--olive);border-radius:10px;padding:6px 10px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:5px}
.tbtn:hover:not(:disabled){background:var(--olive);color:var(--cream)}
.tbtn svg{width:16px;height:16px}
.tbtn.end{background:var(--brick);border-color:var(--brick);color:#fff}
.tbtn.end:hover{background:var(--brick-2)}

/* question panel */
.qpanel{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--olive);color:var(--cream);border-radius:20px;padding:14px 18px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.qpanel::after{content:"";position:absolute;inset:auto 0 0 0;height:5px;background:var(--turnc,var(--accent));transition:background .3s}
.qpanel.timeup{animation:flash .9s 2}
@keyframes flash{50%{background:var(--brick)}}
.q-side{display:flex;flex-direction:column;gap:6px;min-width:150px}
.q-num{font-size:15px;opacity:.85}
.q-num b{font-size:26px;font-weight:900;opacity:1;color:#fff}
.turn-pill{display:inline-flex;align-items:center;gap:6px;background:var(--turnc,var(--accent));color:#fff;border-radius:999px;padding:3px 14px;font-weight:900;font-size:18px;white-space:nowrap}
.q-turnlbl{font-size:13px;opacity:.8}
.q-main{min-width:0}
.q-cat{display:none;margin-bottom:4px}
.q-cat.show{display:block}
.q-cat span{display:inline-block;font-size:13px;font-weight:800;background:rgba(239,228,216,.16);color:#f3d48a;border-radius:999px;padding:1px 12px}
.q-text{font-size:clamp(20px,2.2vw,32px);font-weight:800;line-height:1.45;color:#fff}
.q-text.muted{color:var(--cream);opacity:.75;font-weight:700}
.q-ans{margin-top:6px;font-size:clamp(16px,1.6vw,22px);font-weight:800;color:#f3d48a;display:none}
.q-ans.show{display:block;animation:pop .35s}
.q-state{display:inline-block;margin-top:6px;font-weight:900;font-size:16px;padding:2px 12px;border-radius:999px}
.q-state.right{background:var(--green-2);color:#fff}
.q-state.wrong{background:var(--brick);color:#fff}
.q-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.qb{border:0;border-radius:12px;padding:10px 14px;font-weight:800;font-size:16px;color:#fff;white-space:nowrap}
.qb.ok{background:var(--green-2)} .qb.ok:hover:not(:disabled){background:#5a7f4d}
.qb.no{background:var(--brick)} .qb.no:hover:not(:disabled){background:var(--brick-2)}
.qb.soft{background:rgba(239,228,216,.14);color:var(--cream)} .qb.soft:hover:not(:disabled){background:rgba(239,228,216,.26)}
.qb.next{background:var(--cream);color:var(--olive)} .qb.next:hover{background:#fff}
.qb.go{background:#f3d48a;color:var(--olive-d)} .qb.go:hover{background:#f7e0a6} .qb.go.on{background:var(--brick);color:#fff}
.qb svg{width:18px;height:18px;vertical-align:-3px;margin-inline-end:5px}
.qb.big{font-size:20px;padding:12px 22px}
.qb.shop{background:#6e735c} .qb.shop:hover:not(:disabled){background:#7d826a}
.qb.atk{background:var(--brick)} .qb.atk:hover:not(:disabled){background:var(--brick-2)}
[hidden]{display:none!important}
.q-msg{font-size:clamp(22px,2.4vw,34px);font-weight:900;color:#fff;line-height:1.35}
.q-msg small{display:block;font-size:clamp(14px,1.3vw,18px);font-weight:700;color:var(--cream);opacity:.85;margin-top:2px}
.q-step{display:inline-flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.q-step span{font-size:13px;font-weight:800;border-radius:999px;padding:2px 10px;background:rgba(239,228,216,.14);color:var(--cream)}
.q-step span.on{background:var(--cream);color:var(--olive)}
.q-step span.done{background:var(--green-2);color:#fff}
.autobar{height:4px;border-radius:4px;background:rgba(239,228,216,.2);margin-top:10px;overflow:hidden;display:none}
.autobar.on{display:block}
.autobar i{display:block;height:100%;background:var(--cream);animation:autobar var(--d,3s) linear forwards}
@keyframes autobar{from{width:100%}to{width:0}}
.timer{width:58px;height:58px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff;
  background:conic-gradient(var(--tc,#f3d48a) calc(var(--p,1)*360deg), rgba(239,228,216,.15) 0)}
.timer span{width:46px;height:46px;border-radius:50%;background:var(--olive);display:grid;place-items:center}
.timer.urgent{--tc:#e0674f;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}

/* families */
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:16px}
.grid.many .soldiers .num{font-size:clamp(48px,4.6vw,80px)}
.grid.many .harbor{height:100px}
.grid.many .ship-wrap{width:120px;margin-left:-60px}
.fam{position:relative;background:var(--panel);border:2px solid var(--olive);border-radius:18px;padding:14px 16px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;transition:opacity .3s, box-shadow .3s}
.fam::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;border-radius:16px 16px 0 0;background:var(--fc)}
.fam.is-turn{border-color:var(--fc);box-shadow:0 0 0 4px color-mix(in srgb,var(--fc) 35%,transparent),0 18px 40px -18px rgba(0,0,0,.45);animation:glow 1.6s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 7px color-mix(in srgb,var(--fc) 20%,transparent),0 18px 40px -18px rgba(0,0,0,.45)}}
.fam.not-turn{opacity:.82}
.fam.is-dis{background:repeating-linear-gradient(135deg,var(--panel) 0 14px,#f6ece3 14px 28px)}
.fam.is-sunk{opacity:.6;filter:grayscale(.6)}
.fam-top{display:flex;align-items:center;gap:8px;margin-top:3px}
.fam-name{flex:1;min-width:0;font-family:inherit;font-size:clamp(20px,1.9vw,27px);font-weight:900;color:var(--olive);background:transparent;border:0;border-bottom:1.5px dashed transparent;padding:0;outline:none}
.fam-name:hover,.fam-name:focus{border-bottom-color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:12.5px;border-radius:999px;padding:3px 10px;white-space:nowrap}
.tag svg{width:16px;height:16px}
.tag.crown{color:var(--gold);background:#f7efd9}
.tag.turn{color:#fff;background:var(--fc)}
.ibtn{background:none;border:0;color:#9a917f;padding:4px;border-radius:8px;display:grid;place-items:center}
.ibtn:hover{color:var(--olive);background:var(--cream)}
.ibtn svg{width:18px;height:18px}
.leader{font-size:13.5px;font-weight:700;color:#8f8775;margin-top:-8px}
.badge-dis{align-self:flex-start;background:var(--brick);color:#fff;border:0;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px}

.mid{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.soldiers{display:flex;flex-direction:column;align-items:center;min-width:104px}
.soldiers .num{font-size:clamp(60px,6.2vw,100px);font-weight:900;line-height:.9;color:var(--fc);font-variant-numeric:tabular-nums;transition:transform .2s}
.soldiers .lbl{font-size:17px;font-weight:700}
.harbor{position:relative;height:120px;border-radius:14px;overflow:hidden;background:linear-gradient(#f6efe6,#ece2d5)}
.harbor .sun{position:absolute;top:14px;left:18px;width:26px;height:26px;border-radius:50%;background:#f0d9a8;opacity:.8}
.ship-wrap{position:absolute;left:50%;bottom:16px;width:150px;margin-left:-75px;transform-origin:50% 85%;
  animation:bob 3.2s ease-in-out infinite;transition:bottom .8s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(calc(var(--tilt,0deg) - 2deg))}50%{transform:translateY(-4px) rotate(calc(var(--tilt,0deg) + 2deg))}}
.ship-wrap.sunk{animation:none;transform:rotate(28deg);bottom:-38px;opacity:.7}
.ship{width:100%;display:block}
.ship .sail{fill:var(--fc)}
.smoke{position:absolute;width:14px;height:14px;border-radius:50%;background:rgba(90,90,80,.35);left:52%;top:38%;animation:smoke 2.2s linear infinite}
.smoke:nth-child(2){animation-delay:.7s;left:58%} .smoke:nth-child(3){animation-delay:1.4s;left:46%}
@keyframes smoke{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-60px) scale(2.2);opacity:0}}
.flame{position:absolute;left:40%;top:56%;width:16px;height:22px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#ffe08a,#f08a2c 55%,#c2401f);animation:flick .25s infinite alternate}
@keyframes flick{to{transform:scaleY(1.25) translateY(-2px)}}
.waves{position:absolute;left:0;bottom:0;width:200%;height:34px;animation:waves 7s linear infinite}
.waves.w2{height:26px;animation-duration:4.5s;opacity:.9}
@keyframes waves{to{transform:translateX(50%)}}
.sunk-lbl{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:22px;color:var(--brick)}

.troops{display:grid;grid-template-columns:repeat(25,1fr);gap:2px 3px}
.troops svg{width:100%;height:auto;display:block;fill:var(--fc)}
.troops svg.off{fill:var(--accent);opacity:.35}
.troops svg.extra{fill:var(--gold)}

.money{display:flex;justify-content:space-between;align-items:center;background:var(--olive);color:var(--cream);border-radius:999px;padding:4px 16px}
.money span{font-size:14px;opacity:.85;display:flex;align-items:center;gap:6px}
.money span svg{width:18px;height:18px}
.money b{font-size:22px;font-weight:900}
.inv{display:flex;flex-wrap:wrap;gap:5px;min-height:30px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--cream);border-radius:999px;padding:3px 10px;font-size:13.5px;font-weight:700}
.chip svg{width:16px;height:16px;flex:none}
.chip b{font-weight:900}
.chip em{font-style:normal;font-weight:700;font-size:11.5px;padding:0 7px;border-radius:999px;background:var(--green);color:#fff}
.chip em.wait{background:var(--accent);color:var(--olive)}
.chip.dbl{background:var(--brick);color:#fff}
.chip.used{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent);color:#9a917f;text-decoration:line-through}
.chip.armor{background:var(--green);color:#fff}
.acts{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.btn{border:0;border-radius:12px;padding:10px 8px;font-weight:800;font-size:17px;color:#fff;line-height:1.2;transition:filter .15s,transform .05s}
.btn:active:not(:disabled){transform:translateY(1px)}
.b-green{background:var(--green)} .b-green:hover:not(:disabled){background:var(--green-2)}
.b-olive{background:var(--olive)} .b-olive:hover:not(:disabled){background:var(--olive-2)}
.b-brick{background:var(--brick)} .b-brick:hover:not(:disabled){background:var(--brick-2)}
.b-ghost{background:transparent;color:var(--olive);box-shadow:inset 0 0 0 1.5px var(--accent)}
.b-ghost:hover{background:var(--cream)}
.b-plus{background:var(--cream);color:var(--green);font-size:14px;padding:8px 12px}
.b-plus:hover{background:#e6d8c8}

/* log */
.logwrap{margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding-bottom:84px;position:relative;z-index:1}
.logwrap h2{margin:2px 0 0;font-size:17px;font-weight:900;white-space:nowrap}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;max-height:118px;overflow:auto}
.log li{font-size:14.5px;display:flex;gap:8px;align-items:baseline}
.log li .r{flex:none;font-size:12px;font-weight:800;background:var(--cream);border-radius:6px;padding:0 7px}
.log li.hit{color:var(--brick)} .log li.block,.log li.gain{color:var(--green)} .log li.rnd{font-weight:800;color:var(--sea)}
.log .empty{color:#9a917f}
.sea{position:absolute;left:0;right:0;bottom:0;height:80px;pointer-events:none;overflow:hidden}
.sea svg{position:absolute;bottom:0;left:0;width:200%;height:100%}
.sea .s1{animation:waves 18s linear infinite} .sea .s2{animation:waves 11s linear infinite reverse}

/* fx */
.fx{position:absolute;top:30%;left:50%;transform:translate(-50%,0);font-size:72px;font-weight:900;pointer-events:none;animation:rise 1.8s ease-out forwards;text-shadow:0 3px 0 #fff,0 0 18px #fff;z-index:5;white-space:nowrap}
.fx-hit{color:var(--brick)} .fx-gain{color:var(--green)} .fx-block{color:var(--green);font-size:48px} .fx-buy,.fx-info{color:var(--olive);font-size:38px}
@keyframes rise{0%{opacity:0;transform:translate(-50%,24px) scale(.6)}14%{opacity:1;transform:translate(-50%,0) scale(1.15)}24%{transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-80px)}}
.shake{animation:shake .55s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-.6deg)}40%{transform:translateX(9px) rotate(.6deg)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.04)}}
.proj{position:fixed;left:0;top:0;width:44px;height:44px;z-index:80;pointer-events:none}
.proj svg{width:100%;height:100%;display:block}
.proj.ball{filter:drop-shadow(0 0 8px rgba(255,150,50,.9))}
.proj.fire{width:76px;height:76px;filter:drop-shadow(0 0 16px rgba(255,120,30,1))}
.proj.spy{width:58px;height:58px;color:#222}
.proj.men{width:70px;height:40px;color:var(--green)}
.proj.chain{width:58px;height:58px;color:var(--brick)}
.proj.grenade{color:var(--olive-d)}
.boom{position:fixed;z-index:81;pointer-events:none;left:0;top:0}
.boom .core{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;
  background:radial-gradient(circle,#fff6cf 0,#ffc65a 28%,#e2622d 55%,rgba(155,59,42,.6) 70%,transparent 72%);animation:core .7s ease-out forwards}
.boom.big .core{width:220px;height:220px;margin:-110px 0 0 -110px}
@keyframes core{0%{transform:scale(.1);opacity:1}60%{opacity:1}100%{transform:scale(1.6);opacity:0}}
.boom .ring{position:absolute;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;border:5px solid rgba(255,198,90,.8);animation:ring .7s ease-out forwards}
@keyframes ring{0%{transform:scale(.2);opacity:1}100%{transform:scale(2);opacity:0}}
.boom .spark{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#ffb547;animation:spark .8s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.shieldpop{position:fixed;z-index:81;pointer-events:none;width:120px;height:120px;margin:-60px 0 0 -60px;color:var(--green);animation:shieldpop 1s ease-out forwards}
.shieldpop svg{width:100%;height:100%;filter:drop-shadow(0 0 14px rgba(77,110,65,.8))}
@keyframes shieldpop{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.15);opacity:1}45%{transform:scale(1)}100%{transform:scale(1.05);opacity:0}}

/* banner */
.banner{position:fixed;inset:0;display:none;place-items:center;z-index:90;pointer-events:none;background:rgba(47,50,39,.35)}
.banner.show{display:grid}
.banner .in{background:var(--olive);color:var(--cream);border:3px solid var(--cream);outline:3px solid var(--olive);border-radius:24px;padding:18px 56px;text-align:center;animation:bannerIn 1.6s ease forwards}
.banner small{display:block;font-size:22px;font-weight:700;opacity:.85}
.banner b{display:block;font-size:96px;font-weight:900;line-height:1}
@keyframes bannerIn{0%{transform:scale(.4) rotate(-6deg);opacity:0}18%{transform:scale(1.08) rotate(1deg);opacity:1}28%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(47,50,39,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.scrim.open{display:flex}
.modal{background:var(--paper);border:2px solid var(--olive);border-radius:20px;width:min(660px,100%);max-height:calc(100vh - 36px);overflow:auto;box-shadow:0 30px 80px -30px rgba(0,0,0,.6);animation:pop .2s}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 4px}
.m-head h3{margin:0;font-size:24px;font-weight:900}
.m-head .x{background:none;border:0;font-size:26px;color:var(--olive);line-height:1;padding:4px 8px}
.m-sub{padding:0 20px;color:#7c7564;font-size:15px}
.m-body{padding:12px 20px}
.m-body p{font-size:18px;margin:6px 0 4px;line-height:1.7}
.m-foot{display:flex;gap:8px;flex-wrap:wrap;padding:6px 20px 18px}
.m-foot .btn{flex:1;min-width:140px}
.list{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1.5px solid var(--accent);border-radius:14px;padding:10px 12px;text-align:right;color:var(--olive);font-family:inherit;width:100%}
button.opt:hover:not(:disabled){border-color:var(--olive);background:#fff}
.opt .ic{width:44px;height:44px;border-radius:12px;background:var(--cream);display:grid;place-items:center}
.opt .ic svg{width:26px;height:26px}
.opt .t{font-size:18px;font-weight:800;line-height:1.3}
.opt .d{font-size:13px;color:#7c7564;font-weight:600}
.opt .p{font-weight:900;font-size:16px;white-space:nowrap}
.opt .p .no{display:block;font-size:12px;color:var(--brick);font-weight:700}
.opt.atk .ic{background:var(--brick);color:#fff}
.target{grid-template-columns:1fr auto}
.target .t{font-size:20px}
.target .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.target .big{font-size:30px;font-weight:900}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700}
.form input,.form select,.form textarea{font-family:inherit;font-size:17px;font-weight:700;color:var(--olive);background:var(--panel);border:1.5px solid var(--accent);border-radius:10px;padding:7px 10px}
.form textarea{font-size:16px;font-weight:600;line-height:1.8;min-height:260px;resize:vertical}
.form .full{grid-column:1/-1}
.form .chk{flex-direction:row;align-items:center;gap:8px}
.cats{display:flex;flex-wrap:wrap;gap:6px 14px}
.catchk{font-size:15px!important;background:var(--panel);border:1.5px solid var(--accent);border-radius:10px;padding:5px 10px}
.catchk small{color:#8f8775}
.frows{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:18px 1.3fr 1fr 40px;gap:8px;align-items:center}
.frow input{font-family:inherit;font-size:17px;font-weight:700;color:var(--olive);background:var(--panel);border:1.5px solid var(--accent);border-radius:10px;padding:8px 10px;min-width:0}
.frow .f-l{font-size:15px;font-weight:600}
.fdot{width:18px;height:18px;border-radius:50%}
.fdel{border:0;background:var(--cream);color:var(--brick);border-radius:10px;height:40px;font-size:22px;font-weight:900}
.fdel:hover{background:#f3d3c9}
.hint{font-size:13.5px;color:#7c7564;line-height:1.7}
.danger{margin-top:14px;border-top:1.5px dashed var(--accent);padding-top:12px}

/* winner */
.win{position:fixed;inset:0;z-index:95;display:none;background:radial-gradient(900px 600px at 50% 30%,#5d624d,#2f3227);color:var(--cream);overflow:auto}
.win.show{display:block;animation:pop .4s}
.win canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.win-in{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;text-align:center}
.win-kicker{font-size:22px;font-weight:700;color:var(--accent);letter-spacing:.5px}
.trophy{width:140px;height:140px;color:#e5bd52;filter:drop-shadow(0 8px 24px rgba(229,189,82,.45));animation:trophy 2.4s ease-in-out infinite}
@keyframes trophy{50%{transform:translateY(-8px) rotate(-3deg)}}
.win h2{margin:6px 0 0;font-size:clamp(46px,7vw,96px);font-weight:900;line-height:1.1;color:#fff}
.win .sub{font-size:22px;margin:4px 0 26px;color:var(--cream);opacity:.9}
.podium{display:flex;align-items:flex-end;gap:16px;justify-content:center;margin-bottom:28px;flex-wrap:wrap}
.pod{width:210px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pod .nm{font-size:22px;font-weight:900}
.pod .sc{font-size:17px;opacity:.85}
.pod .blk{width:100%;border-radius:14px 14px 4px 4px;display:grid;place-items:center;font-size:54px;font-weight:900;color:var(--olive)}
.pod.r1 .blk{height:170px;background:#e5bd52}
.pod.r2 .blk{height:120px;background:#d7d2c6}
.pod.r3 .blk{height:84px;background:#c69a6b}
.pod svg.mini{width:110px}
.win-acts{display:flex;gap:10px}
.win-acts button{border:0;border-radius:14px;padding:12px 26px;font-weight:800;font-size:18px}
.wa1{background:var(--cream);color:var(--olive)} .wa2{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 2px var(--cream)}

.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--olive);color:var(--cream);padding:10px 20px;border-radius:999px;font-weight:700;opacity:0;transition:.25s;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== intro walkthrough ===== */
.tbtn.help{background:var(--sea);border-color:var(--sea);color:#fff}
.tbtn.help:hover{background:#4f6b67;border-color:#4f6b67;color:#fff}
.intro{position:fixed;inset:0;z-index:97;display:none;flex-direction:column;color:var(--olive);
  background:radial-gradient(1100px 650px at 50% -5%,#fffaf3,transparent 70%),linear-gradient(#fbf4ec,#efe4d8)}
.intro.show{display:flex}
.i-top{display:flex;justify-content:space-between;align-items:center;padding:16px 26px}
.i-brand{font-weight:800;color:var(--brick);font-size:16px}
.i-skip{background:none;border:1.5px solid var(--olive);border-radius:10px;padding:6px 14px;font-weight:700;color:var(--olive);font-size:14px}
.i-skip:hover{background:var(--olive);color:var(--cream)}
.i-stage{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px 36px;opacity:0;pointer-events:none;transform:translateX(-50px);transition:opacity .45s,transform .45s}
.slide.active{opacity:1;pointer-events:auto;transform:none}
.slide.past{transform:translateX(50px)}
.slide h3{font-size:clamp(30px,3.8vw,54px);font-weight:900;margin:0 0 14px;line-height:1.2}
.slide h3 em{font-style:normal;color:var(--brick)}
.slide p{font-size:clamp(18px,1.8vw,25px);line-height:1.75;max-width:920px;margin:16px 0 0}
.slide .step-kick{font-size:15px;font-weight:800;color:var(--sea);letter-spacing:.3px;margin-bottom:6px}
.slide.active .ani{animation:popIn .5s calc(var(--i,0)*.12s + .15s) both}
@keyframes popIn{from{transform:translateY(16px) scale(.92);opacity:0}to{transform:none;opacity:1}}
.i-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 26px 20px;gap:14px}
.i-btn{border:0;border-radius:14px;padding:12px 28px;font-weight:800;font-size:19px}
.i-next{background:var(--olive);color:var(--cream)} .i-next:hover{background:var(--olive-2)}
.i-prev{background:transparent;color:var(--olive);box-shadow:inset 0 0 0 2px var(--accent)} .i-prev:hover{background:#fff}
.i-dots{display:flex;gap:8px}
.i-dots i{width:10px;height:10px;border-radius:5px;background:var(--accent);transition:.3s;cursor:pointer}
.i-dots i.on{width:30px;background:var(--olive)}

/* hero */
.kick{font-size:20px;font-weight:800;color:var(--brick)}
.hero-t{font-size:clamp(60px,9vw,132px);font-weight:900;margin:0;line-height:1.05}
.slide.active .hero-t{animation:heroIn 1s cubic-bezier(.2,.8,.2,1.15) both}
@keyframes heroIn{from{transform:scale(.55);opacity:0}}
.fleet{position:relative;width:min(980px,92vw);height:180px;margin-top:18px;overflow:hidden;border-radius:22px;background:linear-gradient(#f6efe6,#e9dfd2)}
.fleet .hs{position:absolute;bottom:20px;width:180px}
.slide.active .fleet .hs{animation:sailIn 1.8s cubic-bezier(.2,.7,.2,1) both}
@keyframes sailIn{from{transform:translateX(-115vw)}}
.bobber{transform-origin:50% 85%;animation:bob 3s ease-in-out infinite}
.fleet .waves{height:40px} .fleet .waves.w2{height:30px}
.fam-pills{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.fam-pills span{color:#fff;font-weight:900;font-size:clamp(18px,1.8vw,24px);padding:6px 20px;border-radius:999px}

/* fleet slide */
.demo{display:flex;align-items:center;gap:36px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.demo-num{display:flex;flex-direction:column;align-items:center}
.demo-num b{font-size:clamp(90px,11vw,150px);font-weight:900;line-height:.9;color:var(--olive);font-variant-numeric:tabular-nums}
.demo-num span{font-size:24px;font-weight:800}
.demo-troops{display:grid;grid-template-columns:repeat(10,clamp(22px,2.4vw,34px));gap:8px 10px}
.demo-troops svg{width:100%;fill:var(--olive);opacity:0}
.slide.active .demo-troops svg{animation:popIn .3s calc(var(--i)*22ms + .25s) both}

/* money slide */
.money-demo{display:flex;align-items:center;gap:40px;flex-wrap:wrap;justify-content:center}
.coins{position:relative;width:150px;height:170px}
.coins i{position:absolute;left:15px;width:120px;height:34px;border-radius:50%;background:#e5bd52;box-shadow:inset 0 -6px 0 #b8902f,0 3px 0 #9c7a26;opacity:0}
.slide.active .coins i{animation:coinDrop .5s calc(var(--i)*.18s + .2s) cubic-bezier(.3,1.4,.5,1) both}
@keyframes coinDrop{from{transform:translateY(-220px);opacity:0}to{opacity:1}}
.m-col{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.m-row{display:flex;align-items:center;gap:14px;background:var(--panel);border:2px solid var(--olive);border-radius:18px;padding:10px 22px}
.m-row b{font-size:clamp(34px,3.6vw,52px);font-weight:900;line-height:1.1}
.m-row span{font-size:clamp(17px,1.6vw,22px);font-weight:700;text-align:right}
.m-row.plus b{color:var(--green)}
.m-row.buy b{color:var(--brick)}

/* flow slide */
.flow{display:flex;align-items:stretch;justify-content:center;gap:8px;flex-wrap:wrap;max-width:1300px}
.fs{width:clamp(150px,13vw,200px);background:var(--panel);border:2px solid var(--olive);border-radius:18px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.fs .fi{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:var(--olive);color:var(--cream);font-size:28px;font-weight:900}
.fs .fi svg{width:32px;height:32px}
.fs b{font-size:clamp(18px,1.6vw,23px);font-weight:900}
.fs span{font-size:14.5px;color:#6f6857;font-weight:600;line-height:1.5}
.fs.r .fi{background:var(--green)} .fs.a .fi{background:var(--brick)} .fs.n .fi{background:var(--sea)}
.fa{align-self:center;font-size:30px;font-weight:900;color:var(--accent)}
.note{display:inline-block;background:var(--olive);color:var(--cream);border-radius:999px;padding:8px 22px;font-weight:800;font-size:clamp(16px,1.5vw,21px)!important;margin-top:22px!important}

/* shop slide */
.wgrid{display:grid;grid-template-columns:repeat(3,minmax(0,310px));gap:14px;perspective:900px}
.wc{background:var(--panel);border:2px solid var(--olive);border-radius:18px;padding:14px 14px 12px;display:grid;grid-template-columns:54px 1fr;gap:4px 12px;text-align:right;align-items:center}
.wc .wi{grid-row:span 2;width:54px;height:54px;border-radius:14px;background:var(--cream);display:grid;place-items:center}
.wc .wi svg{width:32px;height:32px}
.wc b{font-size:21px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:6px}
.wc b em{font-style:normal;font-size:14px;background:var(--olive);color:var(--cream);border-radius:999px;padding:1px 10px;white-space:nowrap}
.wc span{font-size:14px;color:#6f6857;font-weight:600;line-height:1.5}
.slide.active .wc{animation:flipIn .55s calc(var(--i)*.13s + .15s) both}
@keyframes flipIn{from{transform:rotateY(80deg);opacity:0}to{transform:none;opacity:1}}

/* battle slide */
.battle{position:relative;width:760px;flex:none;height:230px;border-radius:22px;overflow:hidden;background:linear-gradient(#f6efe6,#e9dfd2)}
.battle .bs{position:absolute;bottom:22px;width:170px}
.battle .bs.a{right:40px} .battle .bs.b{left:40px}
.battle .bs.b .shk{animation:bShake 3.2s infinite}
@keyframes bShake{0%,38%,52%,100%{transform:none}41%{transform:translateX(-9px) rotate(-3deg)}45%{transform:translateX(7px) rotate(2deg)}49%{transform:translateX(-4px)}}
.bball{position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:#2b2b26;box-shadow:0 0 12px rgba(255,140,40,.9);
  offset-path:path("M 640 120 C 520 -50 260 -50 140 125");offset-rotate:0deg;animation:bFly 3.2s infinite}
@keyframes bFly{0%{offset-distance:0%;opacity:1}36%{offset-distance:100%;opacity:1}37%,100%{offset-distance:100%;opacity:0}}
.bboom{position:absolute;left:140px;top:125px;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;
  background:radial-gradient(circle,#fff6cf 0,#ffc65a 28%,#e2622d 55%,rgba(155,59,42,.5) 70%,transparent 72%);animation:bBoom 3.2s infinite;opacity:0}
@keyframes bBoom{0%,36%{transform:scale(.1);opacity:0}38%{opacity:1}52%{transform:scale(1.4);opacity:0}100%{opacity:0}}
.bnum{position:absolute;left:110px;top:30px;font-size:58px;font-weight:900;color:var(--brick);animation:bNum 3.2s infinite;opacity:0;text-shadow:0 3px 0 #fff}
@keyframes bNum{0%,38%{opacity:0;transform:translateY(20px)}45%{opacity:1;transform:none}80%{opacity:1}95%,100%{opacity:0;transform:translateY(-30px)}}
.rl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px;max-width:1100px}
.rl span{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--accent);border-radius:999px;padding:7px 16px;font-size:clamp(15px,1.4vw,19px);font-weight:700}
.rl svg{width:22px;height:22px}

/* double slide */
.dcard{width:300px;background:var(--panel);border:2px solid var(--olive);border-radius:22px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:var(--shadow)}
.dcard .dt{font-size:16px;font-weight:800;color:var(--brick)}
.dcard .dn{font-size:36px;font-weight:900}
.dcard .dx{direction:ltr;font-size:150px;font-weight:900;line-height:1;color:var(--brick)}
.slide.active .dcard .dx{animation:dPulse 1.4s ease-in-out .6s infinite}
@keyframes dPulse{50%{transform:scale(1.12);text-shadow:0 0 30px rgba(226,98,45,.5)}}
.slide.active .dcard{animation:heroIn .8s cubic-bezier(.2,.8,.2,1.15) both}
.drow{display:flex;gap:30px;align-items:center;flex-wrap:wrap;justify-content:center}
.dlist{display:flex;flex-direction:column;gap:10px;text-align:right}
.dlist div{font-size:clamp(18px,1.7vw,24px);font-weight:700;background:var(--panel);border-radius:14px;padding:8px 18px;border-right:6px solid var(--brick)}

/* winner slide */
.i-trophy{width:150px;height:150px;color:#d9ad3c;filter:drop-shadow(0 10px 24px rgba(217,173,60,.45))}
.slide.active .i-trophy{animation:heroIn .9s cubic-bezier(.2,.8,.2,1.2) both, trophy 2.4s ease-in-out 1s infinite}
.prep{display:flex;gap:30px;align-items:center;flex-wrap:wrap;justify-content:center}
.prep-ships{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:460px}
.pship{position:relative;width:130px}
.pshield{position:absolute;top:-6px;left:-4px;width:46px;height:46px;color:var(--green);filter:drop-shadow(0 2px 6px rgba(63,90,53,.4))}
.pshield svg{width:100%;height:100%}
.slide.active .pshield{animation:popIn .5s calc(var(--i)*.12s + .7s) both}
.go-row{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap;justify-content:center}
.go-row button{border:0;border-radius:16px;padding:14px 30px;font-weight:900;font-size:21px}
.go-1{background:var(--sea);color:#fff} .go-1:hover{background:#4f6b67}
.go-2{background:var(--olive);color:var(--cream)} .go-2:hover{background:var(--olive-2)}

/* spotlight tour */
.tour{position:fixed;inset:0;z-index:96;display:none}
.tour.show{display:block}
.hole{position:fixed;border-radius:20px;box-shadow:0 0 0 220vmax rgba(36,38,30,.72);transition:all .45s cubic-bezier(.3,.8,.3,1);pointer-events:none;outline:3px solid #f3d48a;outline-offset:3px}
.tip{position:fixed;width:min(400px,calc(100vw - 32px));background:var(--paper);border:2px solid var(--olive);border-radius:18px;padding:16px 18px 14px;box-shadow:0 20px 50px -20px rgba(0,0,0,.6);transition:top .45s,left .45s}
.tip .tn{font-size:13px;font-weight:800;color:var(--sea)}
.tip h4{margin:2px 0 4px;font-size:22px;font-weight:900}
.tip p{margin:0;font-size:16.5px;line-height:1.7}
.tip .tb{display:flex;gap:8px;margin-top:12px;justify-content:flex-start}
.tip .tb button{border:0;border-radius:10px;padding:8px 18px;font-weight:800;font-size:15px}
.tip .t-next{background:var(--olive);color:var(--cream)} .tip .t-prev{background:transparent;color:var(--olive);box-shadow:inset 0 0 0 1.5px var(--accent)}
.tip .t-skip{background:none;color:#8f8775;margin-inline-start:auto;text-decoration:underline}
@media (max-width:900px){.wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.fa{display:none}}

@media (max-width:1100px){
  .qpanel{grid-template-columns:1fr}
  .q-side{flex-direction:row;align-items:center;justify-content:space-between}
  .q-ctrl{justify-content:flex-start}
}
@media (max-width:980px){
  header{grid-template-columns:1fr;justify-items:center;text-align:center}
  .tools{justify-content:center}
  .frame{padding:8px}.inner{padding:12px 12px 0}
  .logwrap{grid-template-columns:1fr}
}

  .soldiers{min-width:70px}
  .soldiers .num{font-size:clamp(44px,6vw,64px)}
  .harbor{height:92px}

  .fam{padding:12px 12px 10px}
  .fam-name{font-size:20px}

  .qpanel{padding:12px;gap:10px;border-radius:16px}
  .q-text{font-size:20px} .q-msg{font-size:20px}

  .i-dots{gap:4px} .i-dots i{width:7px;height:7px} .i-dots i.on{width:18px}

  .demo-num b{font-size:80px}

  .note{font-size:14px!important;padding:6px 14px;margin-top:12px!important}

let S,H=[],FX=[],muted=false;
function fresh(keep){
  return {round:1,turn:0,q:0,qs:null,rev:false,phase:'q',atk:0,
    cannonLimit:keep?keep.cannonLimit:1,reward:keep?keep.reward:10000,timerSec:keep?keep.timerSec:30,

function load(){
  try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&o.fams&&o.fams.length>=2){S=Object.assign(fresh(),o);}}}catch(e){}
  if(!S)S=fresh();
  S.fams.forEach((f,i)=>{if(/^الأسرة (الأولى|الثانية|الثالثة)$/.test(f.name))f.name=NAMES[i]||f.name;if(f.leader===undefined)f.leader=f.name===NAMES[i]?LEADERS[i]:''});

}

/* ===== animations ===== */
function center(i){const el=document.querySelector(`[data-ship="${i}"]`)||cardEl(i);const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
function fly(from,to,kind,dur){
  return new Promise(res=>{
    const a=center(from),b=center(to);
    const el=document.createElement('div');el.className='proj '+kind;
    el.innerHTML=kind==='ball'?ICON.ball:kind==='fire'?ICON.fire:kind==='spy'?ICON.spy:kind==='men'?ICON.men:kind==='chain'?ICON.disable:kind==='grenade'?ICON.grenade:ICON.ball;
    document.body.appendChild(el);
    const peak=Math.min(a.y,b.y)-Math.max(140,Math.abs(a.x-b.x)*.35), spin=(kind==='spy'||kind==='men')?0:540, frames=[];
    for(let s=0;s<=30;s++){const t=s/30,x=a.x+(b.x-a.x)*t,y=(1-t)*(1-t)*a.y+2*(1-t)*t*peak+t*t*b.y;
      frames.push({transform:`translate(${x}px,${y}px) translate(-50%,-50%) rotate(${t*spin}deg) scale(${1+.45*Math.sin(Math.PI*t)})`})}
    const d=dur||950;
    let done=false;const fin=()=>{if(done)return;done=true;el.remove();res(b)};
    try{const an=el.animate(frames,{duration:d,easing:'cubic-bezier(.3,.1,.6,1)'});an.onfinish=fin}catch(e){fin()}
    setTimeout(fin,d+200);
  });
}

    h+=`<i class="spark" style="--dx:${Math.cos(ang)*dist}px;--dy:${Math.sin(ang)*dist}px;background:${['#ffb547','#e2622d','#ffe08a','#9b3b2a'][k%4]}"></i>`}
  el.innerHTML=h;document.body.appendChild(el);setTimeout(()=>el.remove(),1000);
  const inn=$('#inner');inn.classList.remove('quake');void inn.offsetWidth;inn.classList.add('quake');
}

    shieldPop(p);sfx.clang();
    act(()=>{apply();S.atk++});
  });
  afterAttack();
}
function resolve(i,t,k){
  const a=S.fams[i], d=S.fams[t];
  if(k==='double'){
    modal('كرت المضاعفة','',`<p>هل فازت <b>${esc(a.name)}</b> على <b>${esc(d.name)}</b> في سؤال «أسرع جواب»؟</p>`,[
      {t:'فازت — نفّذ الضربة',cls:'b-brick',fn:()=>{strike(i,t,'fire',true,()=>{a.double=0;const n=kill(d,16);log(`${a.name} استخدمت كرت المضاعفة: قتلت ${ar(n)} من ${d.name} (ضربة لا تُصد)`,'hit');FX.push({i:t,h:sgn('−',n),k:'hit'})})}},
      {t:'خسرت — يضيع الكرت',cls:'b-olive',fn:()=>{sfx.sad();act(()=>{a.double=0;S.atk++;log(`${a.name} خسرت أسرع جواب وضاع كرت المضاعفة`,'block');FX.push({i,t:'ضاع الكرت',k:'info'})});afterAttack()}},
      {t:'إلغاء'}]);
    return;
  }
  if(k==='spy'){
    busy(async()=>{
      sfx.sneak();await fly(i,t,'spy',1000);
      let n=0;act(()=>{a.inv.spy--;S.atk++;n=kill(d,10);log(`جاسوس ${a.name} أقنع ${ar(n)} جنود من ${d.name} بالانضمام لجيشها`,'hit');FX.push({i:t,h:sgn('−',n),k:'hit'})});
      await wait(250);sfx.whoosh(.8);await fly(t,i,'men',900);
      act(()=>{a.soldiers+=n;FX.push({i,h:sgn('+',n),k:'gain'})});H.pop();sfx.coin();
    }).then(afterAttack);
    return;
  }
  if(k==='disable'){
    busy(async()=>{
      sfx.whoosh(.9);const p=await fly(i,t,'chain',900);sfx.clang();
      act(()=>{a.inv.disable--;S.atk++;d.disabledThrough=Math.max(d.disabledThrough,S.round+1);log(`${a.name} عطّلت أسطول ${d.name} حتى نهاية الجولة ${ar(S.round+1)}`,'hit');FX.push({i:t,t:'معطّل',k:'info'})});
    }).then(afterAttack);
    return;
  }
  const kills=W[k].kill, kind=k==='cannon'?'ball':'grenade';
  const consume=()=>{if(k==='cannon')useCannon(a);else a.inv.grenade--};
  const hit=()=>strike(i,t,kind,false,()=>{consume();const n=kill(d,kills);log(`${W[k].n} ${a.name} أصاب ${d.name}: قتل ${ar(n)}`,'hit');FX.push({i:t,h:sgn('−',n),k:'hit'})});
  if(k==='grenade'&&d.inv.armor){
    blocked(i,t,kind,()=>{consume();log(`قنبلة ${a.name} ما أثّرت — جنود ${d.name} مدرّعون`,'block');FX.push({i:t,t:'صُدّت',k:'block'})});
    return;
  }
  if(d.inv.anti>0){
    modal('مضاد قذائف','',`<p>عند <b>${esc(d.name)}</b> ${ar(d.inv.anti)} مضاد قذائف. يستخدمون واحد ويصدّون ${W[k].n} <b>${esc(a.name)}</b>؟</p>`,[
      {t:'نعم — صدّ الضربة',cls:'b-green',fn:()=>{blocked(i,t,kind,()=>{consume();d.inv.anti--;log(`${d.name} صدّت ${W[k].n} ${a.name} بمضاد قذائف`,'block');FX.push({i:t,t:'صُدّت',k:'block'})})}},
      {t:'لا — خلّها تمر',cls:'b-brick',fn:hit},
      {t:'إلغاء'}]);
    return;
  }
  hit();
}

  if(winners.length>1){$('#winName').textContent='تعادل!';$('#winSub').textContent=winners.map(w=>w.f.name).join(' و ')+` · ${ar(top)} جندي لكل أسرة`;}
  else{$('#winName').textContent=r[0].f.name;$('#winSub').textContent=`فازت بالمعركة بـ${ar(top)} جندي`;}
  let rank=0,prev=null;const rk=r.map((x,k)=>{if(x.f.soldiers!==prev){rank=k+1;prev=x.f.soldiers}return{...x,rank}});
  const order=[rk[1],rk[0],...rk.slice(2)].filter(Boolean);
  $('#podium').innerHTML=order.map(x=>`<div class="pod r${Math.min(x.rank,3)}" style="--fc:${FCOL[x.i]};--o:${x.rank}">

  $('#win').classList.add('show');sfx.fanfare();confetti();
}
function hideWinner(){$('#win').classList.remove('show');cancelAnimationFrame(confId);confId=null}
function confetti(){
  const cv=$('#conf'),cx=cv.getContext('2d');let W_=cv.width=innerWidth,H_=cv.height=innerHeight;
  const cols=['#e5bd52','#efe4d8','#9b3b2a','#7f9a92','#c9b8a3','#4d6e41','#fff'];
  const P=Array.from({length:180},()=>({x:Math.random()*W_,y:-Math.random()*H_,w:6+Math.random()*8,h:8+Math.random()*10,vy:1.5+Math.random()*3,vx:-1+Math.random()*2,r:Math.random()*6,vr:-.15+Math.random()*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  cancelAnimationFrame(confId);const start=performance.now();
  (function loop(now){
    cx.clearRect(0,0,W_,H_);const keep=now-start<7000;
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.y>H_+20&&keep){p.y=-20;p.x=Math.random()*W_}
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
    if(keep||P.some(p=>p.y<H_+20))confId=requestAnimationFrame(loop);
  })(start);
}
function checkEnd(){
  const left=S.fams.filter(f=>f.soldiers>0).length;

`<section class="slide">
  <div class="step-kick ani">٤ · الجولة الأولى</div>
  <h3 class="ani" style="--i:1">الجولة الأولى = <em>جولة تجهيز</em></h3>
  <div class="prep">

    <div class="dlist">

`<section class="slide">

</section>`,
`<section class="slide">

  <h3 class="ani" style="--i:1">اضرب… أو احمِ أسطولك</h3>
  <div class="battle"><div class="bs a">${ship(FCOL[0])}</div><div class="bs b"><div class="shk">${ship(FCOL[1])}</div></div><div class="bball"></div><div class="bboom"></div><div class="bnum"><bdi dir="ltr">−٨</bdi></div>${WAVES}</div>
  <div class="rl">
    <span class="ani" style="--i:3">${ICON.cannon}المدفع يبقى معكم ويضرب مرة كل جولة</span>
    <span class="ani" style="--i:4">${ICON.anti}المضاد يصد قذيفة وحدة</span>
    <span class="ani" style="--i:5">${ICON.armor}التدريع يصد كل القنابل اليدوية</span>
    <span class="ani" style="--i:6">${ICON.spy}الجاسوس يسحب ١٠ جنود لجيشكم</span>
    <span class="ani" style="--i:7">${ICON.disable}التعطيل يوقف أسلحة أسرة جولة كاملة</span>
  </div>
</section>`,
`<section class="slide">
  <div class="step-kick ani">٧ · الورقة الرابحة</div>
  <h3 class="ani" style="--i:1">كرت المضاعفة</h3>
  <div class="drow">
    <div class="dcard"><div class="dt">الأخوان بربروسا</div><div class="dn">كرت مضاعفة</div><div class="dx">×٢</div></div>
    <div class="dlist">
      <div class="ani" style="--i:3">كل أسرة تبدأ ومعها <b>كرت واحد</b> مجانًا</div>
      <div class="ani" style="--i:4">قذيفة <b>ما تنصد</b> وتقتل <b>١٦ جندي</b></div>
      <div class="ani" style="--i:5">بشرط تفوزون في سؤال <b>«أسرع جواب»</b> ضد الأسرة اللي تهاجمونها</div>
      <div class="ani" style="--i:6">يُستخدم <b>مرة واحدة</b> بس… فاختاروا وقته صح!</div>
    </div>
  </div>
</section>`,
`<section class="slide">
  <svg class="i-trophy" viewBox="0 0 24 24" fill="currentColor"><path d="M7 3h10v2h3v2.5c0 2.6-1.9 4.7-4.4 5A5 5 0 0 1 13 15.9V18h3v3H8v-3h3v-2.1a5 5 0 0 1-2.6-3.4C5.9 12.2 4 10.1 4 7.5V5h3zm0 4H6v.5c0 1.3.8 2.4 2 2.8A9 9 0 0 1 7 7zm10 0c0 1.2-.3 2.3-1 3.3 1.2-.4 2-1.5 2-2.8V7z"/></svg>
  <h3 class="ani" style="--i:2">مين يفوز؟</h3>
  <p class="ani" style="--i:3">تنتهي المعركة بنهاية الأسئلة أو إذا غرقت الأساطيل…<br><b>والأسرة اللي عندها أكثر جنود هي بطلة «الأخوان بربروسا»!</b></p>
  <div class="go-row ani" style="--i:5"><button class="go-1" id="goTour">تعرّفوا على الشاشة</button><button class="go-2" id="goStart">يلا نبدأ المعركة!</button></div>
</section>`];
  $('#iStage').innerHTML=slides.join('');
  $('#iDots').innerHTML=slides.map((_,k)=>`<i data-k="${k}"></i>`).join('');
  $('#iDots').querySelectorAll('i').forEach(d=>d.onclick=()=>goSlide(+d.dataset.k));
  $('#goTour').onclick=()=>{closeIntro();startTour()};
  $('#goStart').onclick=()=>{closeIntro();letsGo()};
}
function countUp(el){
  const to=+el.dataset.count, suf=el.dataset.suffix||'', t0=performance.now(), dur=1300;
  (function f(now){const p=Math.min(1,(now-t0)/dur),v=Math.round(to*(1-Math.pow(1-p,3)));el.textContent=ar(v)+suf;if(p<1&&el.isConnected)requestAnimationFrame(f)})(t0);
}
function goSlide(k){
  const sl=[...document.querySelectorAll('#iStage .slide')];k=Math.max(0,Math.min(sl.length-1,k));
  sl.forEach((s,j)=>{s.classList.remove('active');s.classList.toggle('past',j<k)});
  void document.body.offsetWidth;sl[k].classList.add('active');
  sl[k].querySelectorAll('[data-count]').forEach(el=>{el.textContent=ar(0)+(el.dataset.suffix||'');setTimeout(()=>countUp(el),350)});
  if(k!==iIdx)sfx.whoosh(.5);
  iIdx=k;fitBattle();
  $('#iDots').querySelectorAll('i').forEach((d,j)=>d.classList.toggle('on',j===k));
  $('#iPrev').style.visibility=k?'visible':'hidden';
  $('#iNext').textContent=k===sl.length-1?'تعرّفوا على الشاشة ←':'التالي ←';
}
function openIntro(){closeModal();buildIntro();iIdx=-1;$('#intro').classList.add('show');goSlide(0)}
function closeIntro(){$('#intro').classList.remove('show');try{localStorage.setItem(IKEY,'1')}catch(e){}}
function introNext(){const n=document.querySelectorAll('#iStage .slide').length;if(iIdx>=n-1){closeIntro();startTour()}else goSlide(iIdx+1)}
$('#iNext').onclick=()=>{sfx.unlock();introNext()};
$('#iPrev').onclick=()=>goSlide(iIdx-1);
$('#iSkip').onclick=closeIntro;
$('#help').onclick=()=>{sfx.unlock();openIntro()};

/* spotlight tour of the real screen */
const TOUR=[
  ['#qpanel','شريط السؤال','هنا يطلع السؤال واسم الأسرة اللي عليها الدور. المشرف يضغط «صح» أو «خطأ»، وبعدها تطلع أزرار «شراء» و«هجوم».'],
  ['[data-card="0"]','خانة الأسرة','لكل أسرة خانة فيها كل شي يخصها. الخانة اللي تلمع وعليها «دورهم» هي صاحبة الدور.'],
  ['[data-card="0"] .mid','الجنود والسفينة','الرقم الكبير = عدد الجنود الباقين. كل ما قلّوا تميل السفينة ويطلع منها دخان… وإذا خلصوا تغرق!'],
  ['[data-card="0"] .money','الخزينة','فلوس الأسرة. تزيد ١٠ آلاف مع كل جواب صح، ومنها تشترون الأسلحة.'],
  ['[data-card="0"] .inv','الأسلحة','كل سلاح تشترونه يطلع هنا، ومعه كرت المضاعفة (ويتشطب إذا استخدمتوه).'],
  ['.round','الجولة','رقم الجولة. الجولة الأولى للتجهيز بدون هجوم، وتبدأ جولة جديدة بعد ما تاخذ كل الأسر دورها، وترجع المدافع جاهزة.'],
  ['.logwrap','سجل المعركة','كل هجوم وشراء وجواب مكتوب هنا، عشان ما يضيع شي.']
];
let tIdx=0;
function startTour(){document.body.style.overflow='hidden';$('#tour').classList.add('show');tIdx=0;placeTour()}
function endTour(go){$('#tour').classList.remove('show');document.body.style.overflow='';if(go)letsGo()}
function placeTour(){
  const [sel,h,p]=TOUR[tIdx], el=document.querySelector(sel);
  if(!el){tIdx<TOUR.length-1?(tIdx++,placeTour()):endTour(true);return}
  el.scrollIntoView({block:'center'});
  const r=el.getBoundingClientRect(), pad=8, hole=$('#hole');
  hole.style.left=(r.left-pad)+'px';hole.style.top=(r.top-pad)+'px';hole.style.width=(r.width+pad*2)+'px';hole.style.height=(r.height+pad*2)+'px';
  $('#tipN').textContent=`${ar(tIdx+1)} / ${ar(TOUR.length)}`;$('#tipH').textContent=h;$('#tipP').textContent=p;
  $('#tPrev').style.visibility=tIdx?'visible':'hidden';
  $('#tNext').textContent=tIdx===TOUR.length-1?'يلا نبدأ!':'التالي';
  const tip=$('#tip'),tw=tip.offsetWidth,th=tip.offsetHeight;
  let top=r.bottom+pad+14; if(top+th>innerHeight-10)top=r.top-pad-14-th; if(top<10)top=Math.min(innerHeight-th-10,r.top+20);
  let left=r.left+r.width/2-tw/2; left=Math.max(14,Math.min(innerWidth-tw-14,left));
  tip.style.top=top+'px';tip.style.left=left+'px';
}
$('#tNext').onclick=()=>{sfx.unlock();if(tIdx>=TOUR.length-1)endTour(true);else{tIdx++;placeTour()}};
$('#tPrev').onclick=()=>{if(tIdx>0){tIdx--;placeTour()}};
$('#tSkip').onclick=()=>endTour(false);
addEventListener('resize',()=>{if($('#tour').classList.contains('show'))placeTour()});
function letsGo(){sfx.drum();banner(prepRound()?'يلا نبدأ! جولة التجهيز':'يلا نبدأ!','الجولة '+ar(S.round),2000)}
document.addEventListener('keydown',e=>{
  if($('#intro').classList.contains('show')){
    if(e.key==='ArrowLeft'||e.key===' '||e.key==='Enter'){e.preventDefault();introNext()}
    else if(e.key==='ArrowRight'){e.preventDefault();goSlide(iIdx-1)}
    else if(e.key==='Escape')closeIntro();
  }else if($('#tour').classList.contains('show')){
    if(e.key==='ArrowLeft'||e.key==='Enter'){e.preventDefault();$('#tNext').click()}
    else if(e.key==='ArrowRight'){e.preventDefault();$('#tPrev').click()}
    else if(e.key==='Escape')endTour(false);
  }
});

try{if(localStorage.getItem(IKEY)!=='1')openIntro()}catch(e){openIntro()}
</script>
